# CRE CLI 工作流设置(官方 schema,`cre workflow build|simulate` 读取本文件)。
# 触发器与 HTTP/EVM 能力均在代码中声明(core.ts 的 CronCapability + cre.handler),
# 这里只告诉 CLI 入口文件、运行时配置与 secrets 的位置。
# 运行方式(项目根为上一层 workflows/):
#   cd zk-cid/workflows
#   cre workflow build compliance-lifecycle -T staging-settings
staging-settings:
  user-workflow:
    workflow-name: "compliance-lifecycle-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.json"
    secrets-path: ""

production-settings:
  user-workflow:
    workflow-name: "compliance-lifecycle-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.json"
    secrets-path: ""
