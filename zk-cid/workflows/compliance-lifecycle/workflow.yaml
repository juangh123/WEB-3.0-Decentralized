# CRE CLI workflow settings (official schema, read by `cre workflow build|simulate`).
# Triggers and the HTTP/EVM capabilities are declared in code (core.ts: CronCapability for
# continuous screening, EVM log trigger on ComplianceGate.UserAdded for screening at
# issuance, both registered with cre.handler). This file only tells the CLI where the entry
# file, runtime config and secrets live.
# Usage (the project root is the parent folder, workflows/):
#   cd zk-cid/workflows
#   cre workflow build compliance-lifecycle -T staging-settings
staging-settings:
  user-workflow:
    workflow-name: "compliance-lifecycle-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.json"
    secrets-path: ""

production-settings:
  user-workflow:
    workflow-name: "compliance-lifecycle-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.json"
    secrets-path: ""
