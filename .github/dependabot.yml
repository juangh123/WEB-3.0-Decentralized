version: 2
updates:
  # The Yarn workspace lives in /zk-cid, so Dependabot points at that directory.
  - package-ecosystem: "npm"
    directory: "/zk-cid"
    schedule:
      interval: "weekly"
    # Version-update PRs are paused while the hackathon submission is under review (security
    # updates still open). Restore to 5 after judging.
    open-pull-requests-limit: 0
    groups:
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
      hardhat:
        patterns:
          - "hardhat*"
          - "@nomicfoundation/*"
      semaphore:
        patterns:
          - "@semaphore-protocol/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0 # paused during judging; restore to 5 afterwards
